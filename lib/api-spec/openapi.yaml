          type: string
          maxLength: 256
        range:
          type: string
          maxLength: 300
        query:
          type: string
          maxLength: 1000
        forms:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 100
        organization_name:
          type: string
          maxLength: 200
        cik:
          type: string
          maxLength: 20
        npi:
          type: string
          maxLength: 20
        state:
          type: string
          maxLength: 100
        skip:
          type: number
          minimum: 0
          maximum: 1000
        page:
          type: number
          minimum: 1
          maximum: 1000
        award_type_codes:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 20
        start_date:
          type: string
          maxLength: 10
        end_date:
          type: string
          maxLength: 10
        from:
          type: string
          maxLength: 10
        to:
          type: string
          maxLength: 10
        cursor:
          type: object
          maxProperties: 20
          additionalProperties: true
        limit:
          type: number
          minimum: 1
          maximum: 100
        reset_cursor:
          type: boolean
          description: Ignore the saved provider cursor for this one-time run. This field must not be stored in schedule_input.
