openapi: 3.1.0
info:
  # Do not change the title: generated import paths depend on it.
  title: Api
  version: 1.1.0
  description: Typed application contract for the Hook Point Opportunity Radar.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: radar
paths:
  /v1/workspace-readiness:
    {
      "get":
        {
          "operationId": "getRadarWorkspaceReadiness",
          "tags": ["radar"],
          "summary": "Read source prerequisites and evidence-backed workspace setup progress",
          "responses":
            {
              "200":
                {
                  "description": "Result",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/WorkspaceReadinessResponse",
                            },
                        },
                    },
                },
            },
        },
    }
  /v1/work-items:
    {
      "get":
        {
          "operationId": "listRadarWorkItems",
          "tags": ["radar"],
          "summary": "List saved work and authoritative filtered counts",
          "responses":
            {
              "200":
                {
                  "description": "Result",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/WorkItemListResponse",
                            },
                        },
                    },
                },
            },
          "parameters":
            [
              {
                "name": "view",
                "in": "query",
                "required": false,
                "schema":
                  {
                    "type": "string",
                    "enum":
                      [
                        "all",
                        "open",
                        "today",
                        "due",
                        "overdue",
                        "upcoming",
                        "snoozed",
                        "completed",
                        "done",
                        "dismissed",
                      ],
                  },
              },
              {
                "name": "company_id",
                "in": "query",
                "required": false,
                "schema": { "type": "string" },
              },
              {
                "name": "owner_name",
                "in": "query",
                "required": false,
                "schema": { "type": "string" },
              },
              {
                "name": "q",
                "in": "query",
                "required": false,
                "schema": { "type": "string" },
              },
              {
                "name": "time_zone",
                "in": "query",
                "required": false,
                "schema": { "type": "string" },
              },
              {
                "name": "limit",
                "in": "query",
                "required": false,
                "schema": { "type": "integer", "minimum": 1, "maximum": 200 },
              },
              {
                "name": "offset",
                "in": "query",
                "required": false,
                "schema": { "type": "integer", "minimum": 0 },
              },
            ],
        },
      "post":
        {
          "operationId": "createRadarWorkItem",
          "tags": ["radar"],
          "summary": "Save an accountable next action",
          "responses":
            {
              "201":
                {
                  "description": "Result",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/WorkItemResponse" },
                        },
                    },
                },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/CreateWorkItemInput" },
                    },
                },
            },
        },
    }
  /v1/work-items/{id}:
    {
      "get":
        {
          "operationId": "getRadarWorkItem",
          "tags": ["radar"],
          "summary": "Get a saved work item",
          "responses":
            {
              "200":
                {
                  "description": "Result",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/WorkItemResponse" },
                        },
                    },
                },
            },
          "parameters":
            [
              {
                "name": "id",
                "in": "path",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
        },
      "patch":
        {
          "operationId": "updateRadarWorkItem",
          "tags": ["radar"],
          "summary": "Complete, snooze, reschedule, dismiss or reopen saved work",
          "responses":
            {
              "200":
                {
                  "description": "Result",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/WorkItemResponse" },
                        },
                    },
                },
            },
          "parameters":
            [
              {
                "name": "id",
                "in": "path",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/UpdateWorkItemInput" },
                    },
                },
            },
        },
    }
  /v1/companies/{id}/evidence-reviews:
    {
      "get":
        {
          "operationId": "listRadarEvidenceReviews",
          "tags": ["radar"],
          "summary": "List source observations and their review decisions",
          "responses":
            {
              "200":
                {
                  "description": "Result",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/EvidenceReviewListResponse",
                            },
                        },
                    },
                },
            },
          "parameters":
            [
              {
                "name": "id",
                "in": "path",
                "required": true,
                "schema": { "type": "string" },
              },
              {
                "name": "status",
                "in": "query",
                "required": false,
                "schema":
                  {
                    "type": "string",
                    "enum":
                      [
                        "all",
                        "unreviewed",
                        "verified",
                        "rejected",
                        "needs_review",
                      ],
                  },
              },
              {
                "name": "limit",
                "in": "query",
                "required": false,
                "schema": { "type": "integer", "minimum": 1, "maximum": 200 },
              },
              {
                "name": "offset",
                "in": "query",
                "required": false,
                "schema": { "type": "integer", "minimum": 0 },
              },
            ],
        },
      "post":
        {
          "operationId": "reviewRadarEvidence",
          "tags": ["radar"],
          "summary": "Review evidence and refresh the company score",
          "responses":
            {
              "200":
                {
                  "description": "Result",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "$ref": "#/components/schemas/ReviewEvidenceResponse",
                            },
                        },
                    },
                },
            },
          "parameters":
            [
              {
                "name": "id",
                "in": "path",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/ReviewEvidenceInput" },
                    },
                },
            },
        },
    }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/dashboard:
    get:
      operationId: getRadarDashboard
      tags: [radar]
      summary: Get portfolio metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
  /v1/companies:
    get:
      operationId: listRadarCompanies
      tags: [radar]
      summary: List ranked companies
      parameters:
        - in: query
          name: tier
          schema:
            $ref: "#/components/schemas/OpportunityTier"
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: identity_review_status
          schema:
            $ref: "#/components/schemas/IdentityReviewStatus"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/CompanyStatus"
        - in: query
          name: min_score
          schema:
            type: number
            minimum: 0
            maximum: 100
        - in: query
          name: page
          schema:
            type: number
            minimum: 1
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Ranked company page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListResponse"
  /v1/companies/{id}:
    get:
      operationId: getRadarCompany
      tags: [radar]
      summary: Get a complete evidence packet
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company evidence packet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetailResponse"
        "404":
          description: Company not found
  /v1/companies/{id}/insights:
    get:
      operationId: getRadarCompanyInsights
      tags: [radar]
      summary: Get an evidence-first account insight packet
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Account insights derived from tenant evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyInsightsResponse"
        "404":
          description: Company not found
  /v1/companies/{id}/outcomes:
    post:
      operationId: recordRadarOutcome
      tags: [radar]
      summary: Record a human-reviewed sales outcome
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutcomeInput"
      responses:
        "201":
          description: Outcome recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeResponse"
  /v1/companies/{id}/identity/confirm:
    post:
      operationId: confirmRadarIdentity
      tags: [radar]
      summary: Confirm an authoritative account identity
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityConfirmationInput"
      responses:
        "200":
          description: Identity confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
  /v1/companies/{id}/identity/merge:
    post:
      operationId: mergeRadarCompanyIdentity
      tags: [radar]
      summary: Merge this account into a reviewed target account
      description: This high-risk operation only runs when confirmed is true.
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityMergeInput"
      responses:
        "200":
          description: Accounts merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityMergeResponse"
  /v1/companies/{id}/identity/separate:
    post:
      operationId: separateRadarCompanyIdentity
      tags: [radar]
      summary: Separate aliases into a new account
      description: This high-risk operation only runs when confirmed is true.
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentitySeparationInput"
      responses:
        "200":
          description: Identity separated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySeparationResponse"
  /v1/analytics/outcomes:
    get:
      operationId: getRadarOutcomeAnalytics
      tags: [radar]
      summary: Get outcome analytics and observational score calibration
      responses:
        "200":
          description: Outcome analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeAnalyticsResponse"
  /v1/analytics/insights:
    get:
      operationId: getRadarAnalyticsInsights
      tags: [radar]
      summary: Get observational portfolio insights
      responses:
        "200":
          description: Tenant-scoped observational insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsInsightsResponse"
  /v1/analytics/outcomes/evaluate:
    post:
      operationId: evaluateRadarScoreCalibration
      tags: [radar]
      summary: Evaluate a guarded score-weight recommendation on a recent holdout cohort
      responses:
        "200":
          description: A blocked evaluation or an approval-ready recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreCalibrationEvaluationResponse"
  /v1/analytics/outcomes/recommendations/{id}/approve:
    post:
      operationId: approveRadarScoreCalibration
      tags: [radar]
      summary: Approve a pending score version after operator review
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved immutable scoring version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreVersionResponse"
        "409":
          description: Recommendation is stale or was already processed
  /v1/ingest:
    post:
      operationId: ingestRadarObservations
      tags: [radar]
      summary: Ingest a batch of canonical observations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationBatchInput"
      responses:
        "200":
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResponse"
        "207":
          description: Batch partially accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResponse"
  /v1/signals:
    get:
      operationId: listRadarSignals
      tags: [radar]
      summary: List inferred opportunity signals
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, expired]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: company_id
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Signal list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalsResponse"
  /v1/connectors:
    get:
      operationId: listRadarConnectors
      tags: [radar]
      summary: List connector readiness and state
      responses:
        "200":
          description: Connector list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorsResponse"
  /v1/connectors/runs:
    get:
      operationId: listRadarConnectorRuns
      tags: [radar]
      summary: Recent connector runs, newest first (administrator only)
      description: Each run records whether the scheduler or an operator started it, so scheduled and manual runs can be told apart.
      parameters:
        - in: query
          name: connector_key
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Connector run history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorRunsResponse"
  /v1/connectors/{key}:
    patch:
      operationId: updateRadarConnector
      tags: [radar]
      summary: Enable or disable a configured connector
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorUpdate"
      responses:
        "200":
          description: Connector updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorResponse"
  /v1/connectors/{key}/run:
    post:
      operationId: runRadarConnector
      tags: [radar]
      summary: Run a configured pull connector
      description: Runs a connector as an administrator and ingests the observations it returns.
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorRunInput"
      responses:
        "200":
          description: Connector completed and results were ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorRunResponse"
        "400":
          description: Invalid connector input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Connector cannot run in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Connector input was understood but could not be processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Connector adapter is not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/data-quality:
    get:
      operationId: getRadarDataQuality
      tags: [radar]
      summary: Get ingestion, identity, freshness, and connector health
      responses:
        "200":
          description: Data quality summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQualityResponse"
  /v1/review-queue:
    get:
      operationId: listRadarReviewQueue
      tags: [radar]
      summary: List accounts requiring human review
      parameters:
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueResponse"
components:
  parameters:
    CompanyId:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    WorkItem:
      {
        "type": "object",
        "required":
          [
            "id",
            "company_id",
            "company_name",
            "company_status",
            "title",
            "created_at",
            "updated_at",
            "created_by",
            "updated_by",
            "owner_name",
            "note",
            "due_at",
            "snoozed_until",
            "resolution_note",
            "completed_at",
            "suggested_next_action",
            "status",
            "is_actionable",
          ],
        "properties":
          {
            "id": { "type": "string" },
            "company_id": { "type": "string" },
            "company_name": { "type": "string" },
            "company_status": { "type": "string" },
            "title": { "type": "string" },
            "created_at": { "type": "string" },
            "updated_at": { "type": "string" },
            "created_by": { "type": "string" },
            "updated_by": { "type": "string" },
            "owner_name": { "type": ["string", "null"] },
            "note": { "type": ["string", "null"] },
            "due_at": { "type": ["string", "null"] },
            "snoozed_until": { "type": ["string", "null"] },
            "resolution_note": { "type": ["string", "null"] },
            "completed_at": { "type": ["string", "null"] },
            "suggested_next_action": { "type": ["string", "null"] },
            "status":
              { "type": "string", "enum": ["open", "done", "dismissed"] },
            "is_actionable": { "type": "boolean" },
          },
      }
    WorkItemResponse:
      {
        "type": "object",
        "required": ["data", "meta"],
        "properties":
          {
            "data": { "$ref": "#/components/schemas/WorkItem" },
            "meta": { "$ref": "#/components/schemas/ResponseMeta" },
          },
      }
    CreateWorkItemInput:
      {
        "type": "object",
        "required": ["company_id", "title"],
        "properties":
          {
            "company_id":
              { "type": "string", "minLength": 1, "maxLength": 200 },
            "title": { "type": "string", "minLength": 1, "maxLength": 240 },
            "owner_name": { "type": ["string", "null"], "maxLength": 200 },
            "note": { "type": ["string", "null"], "maxLength": 2000 },
            "due_at": { "type": ["string", "null"] },
          },
        "additionalProperties": false,
      }
    UpdateWorkItemInput:
      {
        "type": "object",
        "required": [],
        "properties":
          {
            "title": { "type": "string", "minLength": 1, "maxLength": 240 },
            "owner_name": { "type": ["string", "null"], "maxLength": 200 },
            "note": { "type": ["string", "null"], "maxLength": 2000 },
            "due_at": { "type": ["string", "null"] },
            "status":
              { "type": "string", "enum": ["open", "done", "dismissed"] },
            "snoozed_until": { "type": ["string", "null"] },
            "resolution_note":
              { "type": ["string", "null"], "maxLength": 2000 },
          },
        "additionalProperties": false,
        "minProperties": 1,
      }
    WorkItemList:
      {
        "type": "object",
        "required":
          ["data", "total", "limit", "offset", "counts", "as_of", "time_zone"],
        "properties":
          {
            "data":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/WorkItem" },
              },
            "total": { "type": "integer", "minimum": 0 },
            "limit": { "type": "integer", "minimum": 0 },
            "offset": { "type": "integer", "minimum": 0 },
            "counts":
              {
                "type": "object",
                "required":
                  [
                    "all",
                    "open",
                    "today",
                    "due",
                    "overdue",
                    "upcoming",
                    "snoozed",
                    "completed",
                    "dismissed",
                  ],
                "properties":
                  {
                    "all": { "type": "integer", "minimum": 0 },
                    "open": { "type": "integer", "minimum": 0 },
                    "today": { "type": "integer", "minimum": 0 },
                    "due": { "type": "integer", "minimum": 0 },
                    "overdue": { "type": "integer", "minimum": 0 },
                    "upcoming": { "type": "integer", "minimum": 0 },
                    "snoozed": { "type": "integer", "minimum": 0 },
                    "completed": { "type": "integer", "minimum": 0 },
                    "dismissed": { "type": "integer", "minimum": 0 },
                  },
              },
            "as_of": { "type": "string" },
            "time_zone": { "type": "string" },
          },
      }
    WorkItemListResponse:
      {
        "type": "object",
        "required": ["data", "meta"],
        "properties":
          {
            "data": { "$ref": "#/components/schemas/WorkItemList" },
            "meta": { "$ref": "#/components/schemas/ResponseMeta" },
          },
      }
    EvidenceReview:
      {
        "type": "object",
        "required":
          ["observation_id", "status", "note", "reviewed_by", "reviewed_at"],
        "properties":
          {
            "observation_id": { "type": "string" },
            "status":
              {
                "type": "string",
                "enum": ["unreviewed", "verified", "rejected", "needs_review"],
              },
            "note": { "type": ["string", "null"] },
            "reviewed_by": { "type": ["string", "null"] },
            "reviewed_at": { "type": ["string", "null"] },
          },
      }
    EvidenceReviewEntry:
      {
        "type": "object",
        "required":
          [
            "observation_id",
            "status",
            "note",
            "reviewed_by",
            "reviewed_at",
            "title",
            "source",
            "url",
            "observed_at",
          ],
        "properties":
          {
            "observation_id": { "type": "string" },
            "status":
              {
                "type": "string",
                "enum": ["unreviewed", "verified", "rejected", "needs_review"],
              },
            "note": { "type": ["string", "null"] },
            "reviewed_by": { "type": ["string", "null"] },
