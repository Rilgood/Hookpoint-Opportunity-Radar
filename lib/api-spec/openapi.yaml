openapi: 3.1.0
info:
  # Do not change the title: generated import paths depend on it.
  title: Api
  version: 1.1.0
  description: Typed application contract for the Hook Point Opportunity Radar.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: radar
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/dashboard:
    get:
      operationId: getRadarDashboard
      tags: [radar]
      summary: Get portfolio metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
  /v1/companies:
    get:
      operationId: listRadarCompanies
      tags: [radar]
      summary: List ranked companies
      parameters:
        - in: query
          name: tier
          schema:
            $ref: "#/components/schemas/OpportunityTier"
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: identity_review_status
          schema:
            $ref: "#/components/schemas/IdentityReviewStatus"
        - in: query
          name: min_score
          schema:
            type: number
            minimum: 0
            maximum: 100
        - in: query
          name: page
          schema:
            type: number
            minimum: 1
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Ranked company page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListResponse"
  /v1/companies/{id}:
    get:
      operationId: getRadarCompany
      tags: [radar]
      summary: Get a complete evidence packet
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company evidence packet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetailResponse"
        "404":
          description: Company not found
  /v1/companies/{id}/outcomes:
    post:
      operationId: recordRadarOutcome
      tags: [radar]
      summary: Record a human-reviewed sales outcome
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutcomeInput"
      responses:
        "201":
          description: Outcome recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeResponse"
  /v1/companies/{id}/identity/confirm:
    post:
      operationId: confirmRadarIdentity
      tags: [radar]
      summary: Confirm an authoritative account identity
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityConfirmationInput"
      responses:
        "200":
          description: Identity confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
  /v1/companies/{id}/identity/merge:
    post:
      operationId: mergeRadarCompanyIdentity
      tags: [radar]
      summary: Merge this account into a reviewed target account
      description: This high-risk operation only runs when confirmed is true.
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityMergeInput"
      responses:
        "200":
          description: Accounts merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityMergeResponse"
  /v1/companies/{id}/identity/separate:
    post:
      operationId: separateRadarCompanyIdentity
      tags: [radar]
      summary: Separate aliases into a new account
      description: This high-risk operation only runs when confirmed is true.
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentitySeparationInput"
      responses:
        "200":
          description: Identity separated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySeparationResponse"
  /v1/analytics/outcomes:
    get:
      operationId: getRadarOutcomeAnalytics
      tags: [radar]
      summary: Get outcome analytics and observational score calibration
      responses:
        "200":
          description: Outcome analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeAnalyticsResponse"
  /v1/analytics/outcomes/evaluate:
    post:
      operationId: evaluateRadarScoreCalibration
      tags: [radar]
      summary: Evaluate a guarded score-weight recommendation on a recent holdout cohort
      responses:
        "200":
          description: A blocked evaluation or an approval-ready recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreCalibrationEvaluationResponse"
  /v1/analytics/outcomes/recommendations/{id}/approve:
    post:
      operationId: approveRadarScoreCalibration
      tags: [radar]
      summary: Approve a pending score version after operator review
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved immutable scoring version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreVersionResponse"
        "409":
          description: Recommendation is stale or was already processed
  /v1/ingest:
    post:
      operationId: ingestRadarObservations
      tags: [radar]
      summary: Ingest a batch of canonical observations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationBatchInput"
      responses:
        "200":
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResponse"
        "207":
          description: Batch partially accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResponse"
  /v1/signals:
    get:
      operationId: listRadarSignals
      tags: [radar]
      summary: List inferred opportunity signals
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, expired]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: company_id
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Signal list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalsResponse"
  /v1/connectors:
    get:
      operationId: listRadarConnectors
      tags: [radar]
      summary: List connector readiness and state
      responses:
        "200":
          description: Connector list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorsResponse"
  /v1/connectors/{key}:
    patch:
      operationId: updateRadarConnector
      tags: [radar]
      summary: Enable or disable a configured connector
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorUpdate"
      responses:
        "200":
          description: Connector updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorResponse"
  /v1/connectors/{key}/run:
    post:
      operationId: runRadarConnector
      tags: [radar]
      summary: Run a configured pull connector
      description: Runs a connector as an administrator and ingests the observations it returns.
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorRunInput"
      responses:
        "200":
          description: Connector completed and results were ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorRunResponse"
        "400":
          description: Invalid connector input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Connector cannot run in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Connector input was understood but could not be processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Connector adapter is not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/data-quality:
    get:
      operationId: getRadarDataQuality
      tags: [radar]
      summary: Get ingestion, identity, freshness, and connector health
      responses:
        "200":
          description: Data quality summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQualityResponse"
  /v1/review-queue:
    get:
      operationId: listRadarReviewQueue
      tags: [radar]
      summary: List accounts requiring human review
      parameters:
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueueResponse"
components:
  parameters:
    CompanyId:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ResponseMeta:
      type: object
      required: [request_id, duration_ms]
      properties:
        request_id:
          type: string
        duration_ms:
          type: number
    OpportunityTier:
      type: string
      enum: [hot, warm, watch, cold, suppressed]
    CompanyStatus:
      type: string
      enum: [prospect, accepted, rejected, contacted, replied, meeting, opportunity, customer, lost, disqualified]
    IdentityReviewStatus:
      type: string
      enum: [unreviewed, needs_review, confirmed, separated]
    Company:
      type: object
      required:
        - id
        - name
        - industry
        - status
        - monitoring_tier
        - identity_confidence
        - identity_method
        - identity_review_status
        - fit_score
        - need_score
        - intent_score
        - timing_score
        - risk_score
        - opportunity_score
        - opportunity_tier
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: ["string", "null"]
        website_url:
          type: ["string", "null"]
        linkedin_url:
          type: ["string", "null"]
        industry:
          type: string
        subindustry:
          type: ["string", "null"]
        employee_count:
          type: ["number", "null"]
        size_band:
          type: ["string", "null"]
        annual_revenue:
          type: ["number", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/CompanyStatus"
        monitoring_tier:
          type: string
        identity_confidence:
          type: number
        identity_method:
          type: string
        identity_review_status:
          $ref: "#/components/schemas/IdentityReviewStatus"
        fit_score:
          type: number
        need_score:
          type: number
        intent_score:
          type: number
        timing_score:
          type: number
        risk_score:
          type: number
        opportunity_score:
          type: number
        opportunity_tier:
          $ref: "#/components/schemas/OpportunityTier"
        owner_name:
          type: ["string", "null"]
        crm_id:
          type: ["string", "null"]
        last_observed_at:
          type: ["string", "null"]
          format: date-time
        next_refresh_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CompanyResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Company"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    IdentityConfirmationInput:
      type: object
      required: [identity_type, value]
      properties:
        identity_type:
          type: string
          enum: [domain, crm_id, linkedin_url]
        value:
          type: string
        note:
          type: string
    IdentityMergeInput:
      type: object
      required: [target_company_id, confirmed]
      properties:
        target_company_id:
          type: string
        confirmed:
          type: boolean
          description: Must be true; prevents accidental merges.
        note:
          type: string
    IdentitySeparationInput:
      type: object
      required: [name, alias_ids, confirmed]
      properties:
        name:
          type: string
        alias_ids:
          type: array
          minItems: 1
          items:
            type: string
        confirmed:
          type: boolean
          description: Must be true; prevents accidental identity separation.
        note:
          type: string
    IdentityOperation:
      type: object
      required: [source_company_id]
      properties:
        source_company_id:
          type: string
        target_company_id:
          type: string
        separated_company_id:
          type: string
        merged:
          type: boolean
        separated:
          type: boolean
    IdentityMergeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/IdentityOperation"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    IdentitySeparationResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/IdentityOperation"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    DashboardSummary:
      type: object
      required: [companies, hot, warm, watch, average_score, active_signals, new_signals_7d, connectors, top_industries, tiers]
      properties:
        companies:
          type: number
        hot:
          type: number
        warm:
          type: number
        watch:
          type: number
        average_score:
          type: number
        active_signals:
          type: number
        new_signals_7d:
          type: number
        connectors:
          type: object
          required: [configured, enabled, total]
          properties:
            configured:
              type: number
            enabled:
              type: number
            total:
              type: number
        top_industries:
          type: array
          items:
            type: object
            required: [industry, companies, average_score]
            properties:
              industry:
                type: string
              companies:
                type: number
              average_score:
                type: number
        tiers:
          type: array
          items:
            type: object
            required: [tier, count]
            properties:
              tier:
                $ref: "#/components/schemas/OpportunityTier"
              count:
                type: number
    DashboardResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/DashboardSummary"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    CompanyPage:
      type: object
      required: [data, page, limit, total, pages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        page:
          type: number
        limit:
          type: number
        total:
          type: number
        pages:
          type: number
    CompanyListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/CompanyPage"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    Signal:
      type: object
      required: [id, company_id, company_name, signal_key, label, category, base_weight, strength, contribution, summary, source_count, status, first_seen_at, last_seen_at, opportunity_score, opportunity_tier]
      properties:
        id:
          type: string
        company_id:
          type: string
        company_name:
          type: string
        domain:
          type: ["string", "null"]
        signal_key:
          type: string
        label:
          type: string
        category:
          type: string
        base_weight:
          type: number
        strength:
          type: number
        dimension:
          type: string
        confidence:
          type: number
        contribution:
          type: number
        evidence_count:
          type: number
        source_count:
          type: number
        summary:
          type: string
        status:
          type: string
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        opportunity_score:
          type: number
        opportunity_tier:
          $ref: "#/components/schemas/OpportunityTier"
    Observation:
      type: object
      required: [id, source, type, title, confidence, observed_at]
      properties:
        id:
          type: string
        source:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: ["string", "null"]
        url:
          type: ["string", "null"]

        confidence:
          type: number
        observed_at:
          type: string
          format: date-time
    Person:
      type: object
      required: [id, full_name]
      properties:
        id:
          type: string
        full_name:
          type: string
        title:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        confidence:
          type: number
        is_decision_maker:
          type: [number, boolean]
    Recommendation:
      type: object
      required: [offer, rationale, outreach_angle, next_action]
      properties:
        offer:
          type: string
        rationale:
          type: string
        outreach_angle:
          type: string
        next_action:
          type: string
        proof_points:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationProofPoint"
    RecommendationProofPoint:
      type: object
      required: [contribution, label, last_seen_at, source_count, summary]
      properties:
        contribution:
          type: number
        label:
          type: string
        last_seen_at:
          type: string
        source_count:
          type: number
        summary:
          type: string
    MergedRecommendationContext:
      type: object
      required: [source_company_id, source_name, merged_at, offer, rationale, outreach_angle, next_action, proof_points]
      properties:
        source_company_id:
          type: string
        source_name:
          type: string
        merged_at:
          type: string
          format: date-time
        offer:
          type: string
        headline:
          type: ["string", "null"]
        rationale:
          type: string
        outreach_angle:
          type: string
        next_action:
          type: string
        proof_points:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationProofPoint"
    IdentityReviewAlias:
      type: object
      required: [id, alias_type, alias_value, normalized_value, created_at]
      properties:
        id: { type: string }
        alias_type: { type: string }
        alias_value: { type: string }
        normalized_value: { type: string }
        source: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
    IdentityReview:
      type: object
      required: [status, aliases, resolution_events, conflicting_attributes, actions]
      properties:
        status:
          $ref: "#/components/schemas/IdentityReviewStatus"
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/IdentityReviewAlias"
        resolution_events:
          type: array
          items:
            type: object
            additionalProperties: true
        conflicting_attributes:
          type: array
          items:
            type: object
            additionalProperties: true
        actions:
          type: array
          items:
            type: object
            additionalProperties: true
    CompanyDetail:
      type: object
      required: [company, signals, observations, people, merged_recommendation_contexts, events, outcomes, score_history, identity_review]
      properties:
        company:
          $ref: "#/components/schemas/Company"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/Observation"
        people:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        identity_review:
          $ref: "#/components/schemas/IdentityReview"
        recommendation:
          oneOf:
            - $ref: "#/components/schemas/Recommendation"
            - type: "null"
        merged_recommendation_contexts:
          type: array
          description: Historical recommendation context retained from accounts merged into this account. These are not active recommendations.
          items:
            $ref: "#/components/schemas/MergedRecommendationContext"
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        outcomes:
          type: array
          items:
            type: object
            additionalProperties: true
        score_history:
          type: array
          items:
            type: object
            additionalProperties: true
    CompanyDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/CompanyDetail"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    OutcomeInput:
      type: object
      required: [outcome_type]
      properties:
        outcome_type:
          type: string
          enum: [accepted, rejected, contacted, positive_reply, negative_reply, meeting, opportunity, won, lost, disqualified, suppression_correct, suppression_wrong]
        note:
          type: string
    OutcomeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    OutcomeAnalyticsScoreBand:
      type: object
      required: [score_band, labeled, positive, positive_rate]
      properties:
        score_band:
          type: string
        labeled:
          type: number
        positive:
          type: number
        positive_rate:
          type: number
    OutcomeAnalyticsSignalPerformance:
      type: object
      required: [signal_key, labeled, positive, positive_rate]
      properties:
        signal_key:
          type: string
        label:
          type: [string, "null"]
        labeled:
          type: number
        positive:
          type: number
        positive_rate:
          type: number
    OutcomeAnalyticsTotal:
      type: object
      required: [outcome_type, count, amount]
      properties:
        outcome_type:
          type: string
        count:
          type: number
        amount:
          type: number
    CalibrationScoreBand:
      type: object
      required: [score_band, labeled, qualified, negative, raw_qualified_rate, smoothed_qualified_rate, wilson_95_lower, wilson_95_upper, qualified_rate_lift_vs_cold]
      properties:
        score_band:
          type: string
          enum: [hot, warm, watch, cold]
        labeled:
          type: number
          minimum: 0
        qualified:
          type: number
          minimum: 0
        negative:
          type: number
          minimum: 0
        raw_qualified_rate:
          type: number
        smoothed_qualified_rate:
          type: number
        wilson_95_lower:
          type: number
        wilson_95_upper:
          type: number
        qualified_rate_lift_vs_cold:
          type: [number, "null"]
    CalibrationSummary:
      type: object
      required: [labeled_accounts, qualified_accounts, negative_accounts, minimum_sample, min_each_class, sufficient_sample, cohort_note, recommendation]
      properties:
        labeled_accounts:
          type: number
          minimum: 0
        qualified_accounts:
          type: number
          minimum: 0
        negative_accounts:
          type: number
          minimum: 0
        minimum_sample:
          type: number
          const: 30
        min_each_class:
          type: number
          const: 10
        sufficient_sample:
          type: boolean
        cohort_note:
          type: string
        recommendation:
          type: string
          readOnly: true
    OutcomeCalibration:
      type: object
      required: [summary, score_bands]
      properties:
        summary:
          $ref: "#/components/schemas/CalibrationSummary"
        score_bands:
          type: array
          minItems: 4
          maxItems: 4
          items:
