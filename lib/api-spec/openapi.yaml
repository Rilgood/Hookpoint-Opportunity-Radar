        reason: { type: string }
        guardrails: { $ref: "#/components/schemas/ScoreCalibrationGuardrails" }
        before: { $ref: "#/components/schemas/ScoreMetrics" }
        after: { $ref: "#/components/schemas/ScoreMetrics" }
        recommendation: { $ref: "#/components/schemas/ScoreVersion" }
