        holdout_accounts: { type: number }
        qualified_accounts: { type: number }
        negative_accounts: { type: number }
        minimum_sample: { type: number }
        min_each_class: { type: number }
        training_accounts: { type: number }
        training_qualified_accounts: { type: number }
        training_negative_accounts: { type: number }
        minimum_training_sample: { type: number }
        min_training_each_class: { type: number }
        scored_holdout_accounts: { type: number }
        scored_training_accounts: { type: number }
