                              {
                                "code": { "type": "string" },
                                "severity": { "type": "string" },
                                "message": { "type": "string" },
                              },
                          },
                      },
                  },
              },
            "counts":
              {
                "type": "object",
                "required":
                  [
                    "companies",
                    "observations",
                    "reviewed_evidence",
                    "assigned_work",
                    "work_items",
                    "completed_work",
                    "outcomes",
                    "pending_identity",
