          type: ["string", "null"]
          format: date-time
        next_run_at:
          type: ["string", "null"]
          format: date-time
        backoff_until:
          type: ["string", "null"]
          format: date-time
        consecutive_failures:
          type: number
        last_error:
          type: ["string", "null"]
        config:
          type: object
          additionalProperties: true
        last_run:
          oneOf:
            - $ref: "#/components/schemas/ConnectorRunSummary"
            - type: "null"
        schedule:
          $ref: "#/components/schemas/ConnectorSchedule"
    ConnectorSchedule:
      type: object
      description: Why a connector's cadence will or will not run next. Derived by the server from the persisted connector state.
      required:
        [
          state,
          reason,
          will_run,
          next_run_at,
          backoff_until,
          consecutive_failures,
        ]
      properties:
        state:
          type: string
          enum:
            [
              push,
              adapter_pending,
              needs_configuration,
              disabled,
              running,
              backoff,
              input_rejected,
              manual,
              due,
              waiting,
            ]
        reason:
          type: string
        will_run:
          type: boolean
          description: True when the scheduler will pick the connector up without operator action.
        next_run_at:
          type: ["string", "null"]
          format: date-time
        backoff_until:
          type: ["string", "null"]
          format: date-time
        consecutive_failures:
          type: number
    ConnectorRunTrigger:
      type: ["string", "null"]
      enum: [scheduled, manual, null]
      description: Who started the run. Null for runs recorded before the trigger was tracked.
