        identity_confidence: { type: number }
    AnalyticsInsights:
      type: object
      required:
        [
          generated_at,
          thresholds,
          base_rate,
          signal_effectiveness,
          source_effectiveness,
          segments,
          false_confidence,
          hidden_wins,
          decayed_without_action,
          timing,
          loss_reasons,
          focus_list,
          focus_list_policy,
        ]
      properties:
        generated_at: { type: string, format: date-time }
        thresholds:
          type: object
          required: [min_segment_sample, min_signal_sample]
          properties:
            min_segment_sample: { type: number }
            min_signal_sample: { type: number }
        base_rate:
          $ref: "#/components/schemas/CohortCounts"
        signal_effectiveness:
          type: array
          items:
            $ref: "#/components/schemas/EffectivenessRow"
        source_effectiveness:
          type: array
          items:
            $ref: "#/components/schemas/SourceEffectivenessRow"
        segments:
          type: object
          required: [by_industry, by_size_band]
          properties:
            by_industry:
              type: array
              items:
                $ref: "#/components/schemas/SegmentInsight"
            by_size_band:
              type: array
              items:
                $ref: "#/components/schemas/SegmentInsight"
        false_confidence:
          type: array
          items:
            $ref: "#/components/schemas/AccountException"
        hidden_wins:
          type: array
          items:
            $ref: "#/components/schemas/AccountException"
        decayed_without_action:
          type: array
          items:
            type: object
            required:
              [
                company_id,
                name,
                expired_signal_label,
                expired_at,
                opportunity_score,
              ]
            properties:
              company_id: { type: string }
              name: { type: string }
              expired_signal_label: { type: string }
              expired_at: { type: string, format: date-time }
              opportunity_score: { type: number }
        timing:
          type: object
          required: [median_days_first_signal_to_qualified, p25, p75, sample]
          properties:
            median_days_first_signal_to_qualified: { type: [number, "null"] }
            p25: { type: [number, "null"] }
            p75: { type: [number, "null"] }
            sample: { type: number }
        loss_reasons:
          type: array
          items:
            type: object
            required: [company_id, name, outcome_type, note, occurred_at]
            properties:
              company_id: { type: string }
              name: { type: string }
              outcome_type: { type: string }
              note: { type: string }
              occurred_at: { type: string, format: date-time }
        focus_list:
          type: array
          items:
            $ref: "#/components/schemas/FocusAccount"
        focus_list_policy:
          type: object
          required:
            [
              new_signal_14d,
              corroborated_positive_signal,
              identity_unverified,
              closing_urgency,
              note,
            ]
          properties:
            new_signal_14d: { type: number }
            corroborated_positive_signal: { type: number }
            identity_unverified: { type: number }
            closing_urgency: { type: number }
            note: { type: string }
    AnalyticsInsightsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AnalyticsInsights"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
