                    "reviewed_evidence": { "type": "integer", "minimum": 0 },
                    "assigned_work": { "type": "integer", "minimum": 0 },
                    "work_items": { "type": "integer", "minimum": 0 },
                    "completed_work": { "type": "integer", "minimum": 0 },
                    "outcomes": { "type": "integer", "minimum": 0 },
                    "pending_identity": { "type": "integer", "minimum": 0 },
                  },
              },
            "sources":
              {
                "type": "array",
