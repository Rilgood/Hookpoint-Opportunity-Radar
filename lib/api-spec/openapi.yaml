          type: ["string", "null"]
          format: date-time
        duration_ms:
          type: ["number", "null"]
        records_seen:
          type: number
        records_inserted:
          type: number
        records_rejected:
          type: number
        signals_created:
          type: number
        error_message:
          type: ["string", "null"]
    ConnectorRun:
      allOf:
        - $ref: "#/components/schemas/ConnectorRunSummary"
        - type: object
          properties:
            metadata:
              type: object
              additionalProperties: true
            cursor:
              nullable: true
